name: Build book series

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and validate all EPUBs
        run: python tools/build_series.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify published artifacts
        run: python tools/build_series.py --verify-dist

      - name: Upload EPUBs
        uses: actions/upload-artifact@v7
        with:
          name: ai-first-steps-for-kids-epubs
          path: build/*.epub
          if-no-files-found: error
