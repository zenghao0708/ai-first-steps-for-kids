name: Build book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build manuscript
        run: python tools/build_book.py

      - name: Build and validate EPUB
        run: |
          python tools/build_epub.py
          python tools/build_epub.py --validate build/ai-detective.epub

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify published artifact
        run: |
          cmp build/ai-detective.epub dist/ai-detective.epub
          shasum -a 256 -c dist/SHA256SUMS

      - name: Upload EPUB
        uses: actions/upload-artifact@v7
        with:
          name: ai-detective-epub
          path: build/ai-detective.epub
          if-no-files-found: error
